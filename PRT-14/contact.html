<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">JUNDAN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-5 fw-light">Hubungi Saya</h2>
        <div class="row">
            <div class="col-lg-6 mb-4">
                
                <div class="p-4 border rounded shadow-sm h-100 contact-info">
                    <h4 class="mb-4">Informasi Kontak</h4>
                    <p class="fw-bold">Email:</p>
                    <p><a href="mailto:ajriajundan@gmail.com" class="text-decoration-none">ajriajundan@gmail.com</a></p>
                    
                    <p class="fw-bold mt-4">Telepon/WhatsApp:</p>
                    <p><a href="tel:+6283174192722" class="text-decoration-none">+62 831-7419-2722</a></p>

                    <p class="fw-bold mt-4">Alamat:</p>
                    <p>Kp. Tejamaya, Des. Sukaraja, Kec. Rajapolah, Kab. Tasikmalaya</p>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="p-4 border rounded shadow-sm">
                    <h4 class="mb-4">Kirim Pesan</h4>
                    <form action="YOUR_ENDPOINT" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="inputNama" class="form-label">Nama Lengkap</label>
                            <input type="text" class="form-control" id="inputNama" name="nama" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">Alamat Email</label>
                            <input type="email" class="form-control" id="inputEmail" name="_replyto" required>
                        </div>
                        <div class="mb-3">
                            <label for="inputPesan" class="form-label">Pesan</label>
                            <textarea class="form-control" id="inputPesan" name="pesan" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2025 Ajria Jundan Jahid Idris. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script untuk validasi formulir Bootstrap 5
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
    </script>
</body>
